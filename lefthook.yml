pre-commit:
  parallel: false
  jobs:
    - name: scripts
      glob: "*.{cjs,js,mjs,ts,tsx}"
      group:
        piped: true
        jobs:
          - run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
            stage_fixed: true

    - name: styles
      glob: "*.{css,html}"
      group:
        piped: true
        jobs:
          - run: pnpm exec stylelint --cache --fix {staged_files}
            stage_fixed: true
          - run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
            stage_fixed: true

    - name: components
      glob: "*.vue"
      group:
        piped: true
        jobs:
          - run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          - run: pnpm exec stylelint --cache --fix {staged_files}
            stage_fixed: true
          - run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
            stage_fixed: true

    - name: other
      exclude: "*.{cjs,css,html,js,mjs,ts,tsx,vue}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: validate
      run: pnpm run validate
